# 基础配置 —— 所有模式共用
mode: paper            # backtest | paper | live

data:
  source: local        # local(本地 parquet) | akshare | tushare | mock（数据为空时自动降级 mock）
  adjust: post         # 后复权算收益，避免分红送转失真
  start: "2018-01-01"
  end: "2026-09-15"
  cache_dir: data_cache

# 股票池口径（2026-09-17 对齐）：
# 此前写 hs300 + min_list_days 60，但**所有结论**都跑在 liquid 全市场流动性池上
# （上市满 180 天 + 非 ST + 近 20 日日均成交额 ≥ 2e7）。配置默认值与结论口径不一致，
# 照配置跑会得出完全不同的数字。现对齐为研究口径。
# 注：hs300 池含幸存者偏差（历史成分无法从免费源获得），已不作为主口径。
universe:
  index: all           # all + 下面的流动性过滤 = liquid 池；hs300 仅作对照
  exclude: [ST, DELISTED]
  min_list_days: 180   # 次新股过滤：上市不足 180 日不参与（研究口径）
  min_turnover: 20000000.0   # 近 20 日日均成交额下限（元），0 = 不过滤
  lookback: 20         # 上面成交额门槛的回看窗口（交易日）
  max_symbols: 0       # 0 = 不截断（截断按代码序，会引入系统性偏置）

backtest:
  # 回测起点（2026-09-17 对齐）：因子面板从 2019-01-01 起才有完整值
  # （mom_120 等长窗口因子需要预热 + 上市 180 天过滤）。
  # 用 2018 开头会得到一段因子缺失的区间，白白稀释统计功效。
  start: "2019-01-01"
  end: "2026-09-15"
  freq: 1d
  initial_cash: 1000000.0
  benchmark: "000300"  # 沪深300
  cost:
    commission: 0.00025      # 佣金万 2.5
    min_commission: 5.0      # 最低 5 元
    stamp_tax: 0.0005        # 印花税千 0.5（仅卖出）
    transfer_fee: 0.00001
    slippage: 0.001          # 滑点千 1

risk:
  single_stock_max: 0.10
  industry_max: 0.30
  total_position_max: 0.95
  stop_loss: 0.08
  max_drawdown: 0.20
  # 单**日**成交额门槛（元）。默认 0 = 关闭。
  # 旧值 1e8 与股票池的"20 日日均 2e7"差 5 倍，20 只目标里平均只有 5 只
  # 买得进，仓位被压到 27%（详见报告 7.12）。现在流动性由两处分工负责：
  #   universe.min_turnover（能不能投） + liquidity_order_ratio（能吃多少）
  liquidity_min_turnover: 0.0
  # 相对流动性：单笔订单金额 ≤ 当日成交额 / ratio（0 = 不启用）
  liquidity_order_ratio: 10.0

model:
  cross_section: lightgbm
  time_series: lstm
  sentiment: llm_api
  top_k: 20
  score_threshold: 0.55
  # 打分口径中性化（2026-09-17 修）：IC 在「行业+市值中性化」口径上估，
  # 组合也必须按同一口径排序，否则回测出来的 alpha 是口径错位造成的假象
  # （低 PB 会在全市场口径下退化为"买建筑+钢铁"）。
  # 置 false 仅用于 A/B 复盘对照，不要用来下结论。
  score_neutralize: true
  # 成本感知定权（B1）：定权值 = |RankICIR| / turnover ** ic_cost_penalty。
  # 0.0 = 现状（逐字不变）；1.0 = 完全按净口径。
  # 动机：原口径不看换手，权重恰好压在换手 0.5~0.8 的量价因子上，
  # 而组合加权平均换手 0.2641 正是"成本吃掉 alpha"的直接来源。
  # 只支持 weight_source="ic"（静态定权）；"ic_wf" 会主动报错，
  # 因为滚动窗口的 summary 没有 turnover 列、无法保证同一窗口口径。
  ic_cost_penalty: 0.0

frontend:
  theme: dark
  up_color: red       # A 股习惯：红涨绿跌
  currency: CNY

execution:
  broker: sim
  account_id: sim
  persist_path: runtime/sim_account.json
  poll_interval: 3.0
